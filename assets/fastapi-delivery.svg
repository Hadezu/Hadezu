<svg xmlns="http://www.w3.org/2000/svg" width="760" height="921" viewBox="0 0 760 921" role="img" aria-labelledby="title desc"><title id="title">Delivery with a recoverable record</title><desc id="desc">FastAPI extension · synthetic partner with durable receipt contract</desc><rect width="760" height="921" rx="16" fill="#102133"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="44" font-size="29" fill="#ffffff" font-weight="700">Delivery with a recoverable record</text><text x="30" y="77" font-size="19" fill="#c7d5e2">FastAPI extension · synthetic partner with durable receipt contract</text><rect x="30" y="104" width="700" height="78" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="133" font-size="23" fill="#ffffff" font-weight="700">01  Receive</text><text x="48" y="162" font-size="21" fill="#c7d5e2">Signed event enters the application.</text><rect x="30" y="198" width="700" height="78" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="227" font-size="23" fill="#ffffff" font-weight="700">02  Persist</text><text x="48" y="256" font-size="21" fill="#c7d5e2">PostgreSQL inbox / outbox retain the work.</text><rect x="30" y="292" width="700" height="78" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="321" font-size="23" fill="#ffffff" font-weight="700">03  Process</text><text x="48" y="350" font-size="21" fill="#c7d5e2">A leased worker delivers to the HTTP partner.</text><rect x="30" y="386" width="700" height="78" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="415" font-size="23" fill="#ffffff" font-weight="700">04  Confirm</text><text x="48" y="444" font-size="21" fill="#c7d5e2">Durable receipts preserve the known outcome.</text><text x="30" y="519" font-size="26" fill="#ffffff" font-weight="700">When delivery is interrupted</text><rect x="30" y="546" width="700" height="104" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="575" font-size="23" fill="#77dfcd" font-weight="700">Duplicate event</text><text x="48" y="606" font-size="20" fill="#c7d5e2">Identity checks reuse recorded work.</text><text x="48" y="633" font-size="20" fill="#c7d5e2">Repeat delivery is a case to handle explicitly.</text><rect x="30" y="665" width="700" height="104" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="694" font-size="23" fill="#77dfcd" font-weight="700">Lost response</text><text x="48" y="725" font-size="20" fill="#c7d5e2">Reconcile using the partner receipt contract.</text><text x="48" y="752" font-size="20" fill="#c7d5e2">A missing HTTP reply does not prove failure.</text><rect x="30" y="784" width="700" height="104" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="813" font-size="23" fill="#77dfcd" font-weight="700">Worker stops</text><text x="48" y="844" font-size="20" fill="#c7d5e2">Leases allow interrupted work to be recovered.</text><text x="48" y="871" font-size="20" fill="#c7d5e2">Operators inspect status and replay reasons.</text></g></svg>
