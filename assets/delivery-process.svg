<svg xmlns="http://www.w3.org/2000/svg" width="760" height="667" viewBox="0 0 760 667" role="img" aria-labelledby="title desc"><title id="title">From a business need to working software</title><desc id="desc">Proposed collaboration process · scope agreed for each engagement</desc><rect width="760" height="667" rx="16" fill="#102133"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="44" font-size="29" fill="#ffffff" font-weight="700">From a business need to working software</text><text x="30" y="77" font-size="19" fill="#c7d5e2">Proposed collaboration process · scope agreed for each engagement</text><rect x="30" y="103" width="700" height="75" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="132" font-size="23" fill="#ffffff" font-weight="700">01  Business problem</text><text x="48" y="161" font-size="20" fill="#c7d5e2">Understand the workflow and intended outcome.</text><rect x="30" y="194" width="700" height="75" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="223" font-size="23" fill="#ffffff" font-weight="700">02  Requirements</text><text x="48" y="252" font-size="20" fill="#c7d5e2">Agree users, boundaries and acceptance criteria.</text><rect x="30" y="285" width="700" height="75" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="314" font-size="23" fill="#ffffff" font-weight="700">03  Solution design</text><text x="48" y="343" font-size="20" fill="#c7d5e2">Choose interfaces, data contracts and milestones.</text><rect x="30" y="376" width="700" height="75" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="405" font-size="23" fill="#ffffff" font-weight="700">04  Implementation</text><text x="48" y="434" font-size="20" fill="#c7d5e2">Build in reviewable changes and demonstrate progress.</text><rect x="30" y="467" width="700" height="75" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="496" font-size="23" fill="#ffffff" font-weight="700">05  Verification</text><text x="48" y="525" font-size="20" fill="#c7d5e2">Check agreed behavior, failures and user journeys.</text><rect x="30" y="558" width="700" height="75" rx="10" fill="#1c3449" stroke="#365168"/><text x="48" y="587" font-size="23" fill="#ffffff" font-weight="700">06  Delivery</text><text x="48" y="616" font-size="20" fill="#c7d5e2">Hand over code, setup notes and verification evidence.</text></g></svg>
